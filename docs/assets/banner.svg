    <rect x="300" y="266" width="170" height="40" rx="20" fill="none" stroke="#fb923c"/>
    <text x="326" y="292">100% Anonymous</text>
    <rect x="486" y="266" width="170" height="40" rx="20" fill="none" stroke="#fb923c"/>
    <text x="512" y="292">Hackathon MVP</text>
  </g>
