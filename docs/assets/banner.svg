<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Sociora banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#3a1d0c"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- network of anonymous nodes -->
  <g stroke="#fb923c" stroke-opacity=".25" stroke-width="1.5" fill="none">
    <path d="M720 90 L860 160 L1010 110 L1100 230 L940 300 L800 260 L720 90"/>
    <path d="M860 160 L940 300"/><path d="M1010 110 L940 300"/><path d="M800 260 L860 160"/>
  </g>
  <g fill="#faf7f2" fill-opacity=".9">
    <circle cx="720" cy="90" r="9"/><circle cx="1010" cy="110" r="9"/><circle cx="1100" cy="230" r="9"/>
    <circle cx="800" cy="260" r="9"/>
  </g>
  <g fill="url(#ac)">
    <circle cx="860" cy="160" r="22"/><circle cx="940" cy="300" r="16"/>
  </g>
  <circle cx="860" cy="160" r="38" fill="none" stroke="#fb923c" stroke-opacity=".4"/>
  <text x="60" y="170" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#faf7f2">Sociora</text>
  <text x="64" y="225" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#fdba74">Ask anonymously. Get answers from people who've lived it.</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#faf7f2">
    <rect x="64" y="266" width="220" height="40" rx="20" fill="none" stroke="#fb923c"/>
